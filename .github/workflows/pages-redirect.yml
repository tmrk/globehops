# GlobeHops moved to Cloudflare Pages (https://globehops.marki.im/). GitHub Pages now serves only a
# small redirect site at https://tmrk.github.io/globehops/ so existing links keep working: every
# path below /globehops/, its query and its fragment open the same page on the new domain. Its
# sw.js retires the app's old offline worker. Publishes only when the redirect files change.
name: GitHub Pages redirect

on:
  push:
    branches: [main]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One redirect page serves the root, the static locale pages (with their own canonical
      # address) and, as 404.html, every other old path.
      - name: Assemble the redirect site
        run: |
          src=.github/pages-redirect
          mkdir -p _site
          cp "$src/index.html" "$src/sw.js" "$src/llms.txt" _site/
          cp "$src/index.html" _site/404.html
          for lang in en hu sv; do
            mkdir -p "_site/$lang"
            sed "s#https://globehops.marki.im/\"#https://globehops.marki.im/$lang/\"#g" "$src/index.html" > "_site/$lang/index.html"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
