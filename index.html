<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>GlobeHops — your journey on a 3D globe</title>
    <meta
      name="description"
      content="Enter airports and see your journey by air as true great-circle routes on an interactive 3D globe, with distances and estimated flight times."
    />
    <meta name="theme-color" content="#05080f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="describedby" type="application/json" href="%BASE_URL%agent/capabilities.json" />
    <link rel="help" type="text/markdown" href="%BASE_URL%llms.txt" title="Agent and LLM guide" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GlobeHops",
        "url": "https://tmrk.github.io/globehops/",
        "description": "Explore air journeys on an interactive 3D globe with great-circle distances, estimated flight times and airport-local schedules.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/license/mit/",
        "sameAs": "https://github.com/tmrk/globehops",
        "potentialAction": {
          "@type": "ViewAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://tmrk.github.io/globehops/?route={route}"
          }
        }
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlobeHops" />
    <meta property="og:title" content="GlobeHops — your journey on a 3D globe" />
    <meta
      property="og:description"
      content="See any journey by air as it really curves around the Earth: great-circle routes, distances and estimated flight times."
    />
    <meta property="og:url" content="https://tmrk.github.io/globehops/" />
    <meta property="og:image" content="https://tmrk.github.io/globehops/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A 3D globe showing a flight route from Copenhagen via London to New York." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Paint the backdrop before any CSS/JS arrives. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><p style="color: #eee; font-family: system-ui; padding: 24px">
        GlobeHops needs JavaScript to show your journey on the globe. Agents can read the
        <a href="%BASE_URL%llms.txt">agent and LLM guide</a>.
      </p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
